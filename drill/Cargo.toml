[package]
name = "hix-drill"
version = "0.1.0"
edition = "2021"
authors = ["Joel Bugarini"]
description = "CLI Codebase Analyzer for Hix"
license = "GPL-2.0"

[lib]
name = "hix_drill"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
regex = "1.10"
tree-sitter = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-html = "0.23"
similar = "2.5"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
